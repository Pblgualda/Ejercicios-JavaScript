<!DOCTYPE html>

    <link rel="stylesheet" href="styles.css">
</head>

    <h1>Explorador del BOM</h1>

        <h2>Informacion:</h2>
        <div id="info1"></div>
        <div id="info2"></div>
        <div id="info3"></div>
        <div id="info4"></div>
    </div>
    <div class="contenedor">
        <h2>Redireccionar</h2>

            <input type="button" value="Ir a google" onclick="abrir()">

    </div>



    <div class="contenedor">
        <h2>navegacion</h2> 
        <div id="nave"></div>
    </div>

    <div class="contenedor">

        <div id="resolucionCompleta"></div>

        <div id="orientacion"></div>
        <div id="color"></div>
        <div id="pixel"></div>
    </div>

        

    

    <script src="index.js"></script>
