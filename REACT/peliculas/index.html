<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores</title>
    <script src="index.js"></script>
    <style>
        body
        {
            background-color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
        }

        button
        {
            background-color: antiquewhite;
            color: black;
            width: 60px;
            border-radius: 30%;
            border: black 1px ;
            height: 80px;

        }
        div
        {
            width: 50%;
            height: 50%;
            padding: 50px;
            border-radius: 10px;
            border: solid 2px;
            display: flex;
            flex-direction: column;
            
        }
        div h2
        {
            font-size: 15px;
            width: 100%;
        }
        div img
        {
            width: 90%;
            height: 90%;
        }
        #contenedor
        {
            display: flex;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="contenedor">
    </div>

    <button id="btnCargar">Hola carga</button>
    
</body>
</html>
